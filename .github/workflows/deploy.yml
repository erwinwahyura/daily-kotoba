name: Deploy Backend to Hetzner

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install SQLite deps
        run: sudo apt-get install -y gcc libsqlite3-dev

      - name: Run tests
        run: CGO_ENABLED=1 go test ./...

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /opt/kotoba/daily-kotoba

            echo "Pulling latest code..."
            git pull origin main

            echo "Rebuilding and restarting..."
            docker compose -f docker-compose.hetzner.yml down --remove-orphans
            docker compose -f docker-compose.hetzner.yml up -d --build

            echo "Waiting for health check..."
            sleep 10
            curl -sf http://localhost:8090/health || (docker compose -f docker-compose.hetzner.yml logs --tail=50 && exit 1)

            echo "Deploy complete."
